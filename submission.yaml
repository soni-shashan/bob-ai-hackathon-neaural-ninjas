project_name: "GridGuard AI"
tagline: "Predictive Grid Resilience & Equipment Failure Advisor"
hackathon: "IBM Bob Hackathon"
team_name: "Neural Ninjas"
version: "1.0.0"
category: "AI for Infrastructure & Grid Resilience"

problem_statement: >
  High-voltage power transformers and substation equipment suffer catastrophic failures
  leading to multi-million dollar outages and safety risks. Utilities rely on calendar-based
  maintenance while sensor telemetry, extreme weather forecasts, and asset criticalities remain
  siloed. GridGuard AI integrates sensor health telemetry, ML failure prediction, dynamic weather
  risk, and crew locations to produce real-time risk prioritizations, actionable maintenance interventions,
  and crew pre-positioning.

key_features:
  - "Real-time sensor telemetry anomaly detection (Temperature, Vibration, Partial Discharge, Oil Quality, Load)"
  - "Composite Risk Engine (Equipment ML Probability + Weather Stress + Customer Impact + Criticality)"
  - "Automated Maintenance Prioritization & Skill-Matched Crew Pre-positioning"
  - "Dedicated TR-104 Naroda Substation Interactive Hackathon Simulation Scenario"
  - "Enterprise Dark Industrial Grid Operations Center Dashboard"
  - "AI Operator Advisor with Structured Evidence & Mitigation Guidance"
  - "Pluggable ML Service Boundary ready for teammate's ML inference model"

stack:
  frontend:
    framework: "React 18 + TypeScript"
    bundler: "Vite"
    styling: "Tailwind CSS (Custom Dark Industrial Grid Operations Design System)"
    visualization: "Recharts, Interactive SVG Schematic Grid Topology"
    icons: "Lucide React"
  backend:
    framework: "Python 3.12 + FastAPI"
    database: "SQLite (SQLAlchemy ORM + Pydantic v2)"
    architecture: "Modular Services (Risk Engine, Maintenance Optimizer, ML Bridge, AI Advisor)"
    testing: "Pytest + HTTPX"

repository_structure:
  backend: "src/backend"
  frontend: "src/frontend"
  shared: "src/shared"
  docs: "docs"
  presentation: "presentation"
  demo: "demo"

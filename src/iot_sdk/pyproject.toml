[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridguard-iot-sdk"
version = "1.0.0"
description = "Python IoT client library for GridGuard AI transformer monitoring platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Team Neural Ninjas"}
]
keywords = ["iot", "transformer", "monitoring", "predictive-maintenance", "gridguard"]

# Zero external dependencies - uses Python stdlib only
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["gridguard_iot*"]
